<!DOCTYPE html>
<html>

<head>
    <title>Chatbot</title>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src=" https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script type="text/babel">
        // Create a chat input component
        function ChatInput({ chatMessages, setChatMessages, isLoading, setisLoading }) {
            const [inputText, setInputText] = React.useState('');
            function saveInputText() {
                setInputText(event.target.value);
            }
            function sendMessageOnKeyDown() {
                if (event.key === 'Enter') {
                    setisLoading(true);
                    const newChatMessages = [
                        ...chatMessages,
                        {
                            message: inputText,
                            sender: 'user',
                            id: crypto.randomUUID()
                        },
                        {
                            message: 'Loading...',
                            sender: 'robot',
                            id: crypto.randomUUID()
                        }
                    ]


                    setChatMessages(newChatMessages);

                    const response = Chatbot.getResponse(inputText);
                    setChatMessages([
                        ...newChatMessages.slice(0, newChatMessages.length - 1),
                        {
                            message: response,
                            sender: 'robot',
                            id: crypto.randomUUID()
                        }
                    ]);
                    setisLoading(false);

                    setInputText('');
                }
                else if (event.key === 'Escape') {
                    setInputText('');

                }
            }

            async function sendMessage() {
                setisLoading(true)
                const newChatMessages = [
                    ...chatMessages,
                    {
                        message: inputText,
                        sender: 'user',
                        id: crypto.randomUUID()
                    },
                    {
                        message: 'Loading...',
                        sender: 'robot',
                        id: crypto.randomUUID()
                    }
                ]
                setInputText('');
                setChatMessages(newChatMessages);
                const response = await Chatbot.getResponseAsync(inputText);

                setChatMessages([
                    ...newChatMessages.slice(0, newChatMessages.length - 1), ,
                    {
                        message: response,
                        sender: 'robot',
                        id: crypto.randomUUID()
                    }
                ]);
                setisLoading(false);



            }
            return (
                <>
                    <input
                        placehoder="Send a message to Chatbot"
                        size="30"
                        disabled={isLoading}
                        onChange={saveInputText}
                        value={inputText} //Controlled input
                        onKeyDown={sendMessageOnKeyDown}
                    />
                    <button onClick={sendMessage} >Send</button>
                </>
            );
        }
        //Create a chat message component
        function ChatMessage({ message, sender }) {
            // const message = props.message;
            // const sender = props.sender;

            //Destructuring params: ^ shortcut
            // const { message, sender } = props;

            /*
            if (sender === 'robot') {
                return (
                    <div>
                        {message}
                        <img src="robot.png" width="50" />
                    </div>
                );
            }
            */

            // Using guard operator
            return (
                <div>
                    {sender === 'robot' && (
                        <img src="robot.png" width="50" />
                    )}
                    {message}
                    {sender === 'user' && (
                        <img src="user.png" width="50" />
                    )}
                </div>
            );

        }
        function ChatMessages({ chatMessages }) {

            return (
                <>
                    {chatMessages.map((chatMessage) => {
                        return (
                            <ChatMessage
                                message={chatMessage.message}
                                sender={chatMessage.sender}
                                key={chatMessage.id}
                            />
                        );

                    })}
                </>
            );
        }

        //Create an App component
        function App() {


            // State is the data that is connected to the HTML. When we update this data, it will update the HTML.

            //Array destructuring
            const [chatMessages, setChatMessages] = React.useState([]);
            const [isLoading, setisLoading] = React.useState(false);

            // const chatMessages = array[0]; ---> current data
            // const setChatMessages = array[1]; --> updater function (to update the data)

            //Use array destructuring ^
            // const [chatMessages, setChatMessages] = array;


            return (
                <>
                    <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages} //save any type of data inside prop 
                        isLoading={isLoading}
                        setisLoading={setisLoading}
                    />
                    <ChatMessages
                        chatMessages={chatMessages}
                    />
                </>
            );
        }

        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container).render(<App />);

    </script>
</body>

</html>
